<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security findings</title>
<style>
  :root {
    --navy: #12294a; --blue: #1f5fbf; --ink: #1d2733; --muted: #667085;
    --line: #dde3ea; --bg: #f3f5f8; --card: #fff;
    --p1: #b42318; --p1bg: #fdecea; --p2: #b54708; --p2bg: #fef0e0;
    --p3: #8a6d00; --p3bg: #fdf6d8; --p4: #475467; --p4bg: #eef1f5;
    --ok: #067647; --okbg: #e6f5ec;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
  header { background: var(--navy); color: #fff; padding: 0.9rem clamp(1rem, 4vw, 2.5rem); display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  header h1 { font-size: 1.15rem; margin: 0; font-weight: 600; }
  header p { margin: 0; color: #aebfd6; font-size: 0.85rem; }
  .sync { display: flex; align-items: center; gap: 0.75rem; font-size: 0.85rem; color: #aebfd6; }
  .sync button { background: transparent; color: #fff; border-color: #4a6283; }
  .sync button:hover { background: #1d3a63; }
  main { max-width: 1320px; margin: 0 auto; padding: 1.5rem clamp(1rem, 4vw, 2.5rem) 3rem; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-top: 4px solid var(--line); border-radius: 6px; padding: 0.8rem 1rem; }
  .kpi strong { display: block; font-size: 1.9rem; line-height: 1.15; }
  .kpi span { color: var(--muted); font-size: 0.82rem; }
  .kpi.P1 { border-top-color: var(--p1); } .kpi.P2 { border-top-color: var(--p2); }
  .kpi.P3 { border-top-color: var(--p3); } .kpi.P4 { border-top-color: var(--p4); }
  .kpi.late.hot { border-top-color: var(--p1); background: var(--p1bg); }
  .kpi.late.hot strong { color: var(--p1); }

  .mix { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin: 1rem 0 1.5rem; background: var(--line); }
  .mix div { transition: flex-grow 0.6s ease; }
  .mix .P1 { background: var(--p1); } .mix .P2 { background: var(--p2); }
  .mix .P3 { background: #c9a400; } .mix .P4 { background: #98a2b3; }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 6px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; padding: 0.75rem 1rem; border-bottom: 1px solid var(--line); }
  .toolbar input[type=search] { flex: 1 1 14rem; }
  .toolbar label { color: var(--muted); display: flex; align-items: center; gap: 0.4rem; }
  .count { margin-left: auto; color: var(--muted); }
  select, input[type=search], button { font: inherit; padding: 0.35rem 0.6rem; border: 1px solid var(--line); border-radius: 4px; background: #fff; color: var(--ink); }
  button { cursor: pointer; }
  button:hover { background: var(--bg); }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 60rem; }
  th, td { text-align: left; padding: 0.65rem 1rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { background: #f8f9fb; color: var(--muted); font-weight: 600; font-size: 0.82rem; }
  tr.row { cursor: pointer; transition: background 0.15s; }
  tr.row:hover { background: #f6f8fb; }
  tr.row.open { background: #eef3fb; }
  .title { font-weight: 600; }
  .sub { color: var(--muted); font-size: 0.8rem; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .muted { color: var(--muted); }

  .pill, .badge, .tag { display: inline-block; border-radius: 999px; padding: 0.1rem 0.6rem; font-size: 0.8rem; font-weight: 600; white-space: nowrap; }
  .pill.P1 { color: var(--p1); background: var(--p1bg); } .pill.P2 { color: var(--p2); background: var(--p2bg); }
  .pill.P3 { color: var(--p3); background: var(--p3bg); } .pill.P4 { color: var(--p4); background: var(--p4bg); }
  .badge.bad { color: var(--p1); background: var(--p1bg); }
  .badge.warn { color: var(--p2); background: var(--p2bg); }
  .badge.ok { color: var(--ok); background: var(--okbg); }
  .tag { color: var(--p4); background: var(--p4bg); font-weight: 500; }
  .tag.prod { color: #5b2a86; background: #f1e8fa; font-weight: 600; }

  tr.detail td { background: #fbfcfe; padding: 1.1rem 1.5rem 1.3rem; }
  tr.detail.hidden { display: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(18rem, 1fr)); gap: 0 2.5rem; }
  .grid h3 { font-size: 0.85rem; margin: 0 0 0.3rem; }
  .grid ul, .grid ol { margin: 0; padding-left: 1.2rem; }
  .actions { margin-top: 1rem; display: flex; gap: 0.5rem; }
  .actions button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .empty { color: var(--muted); padding: 2.5rem 1rem; text-align: center; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <div>
    <h1>Security findings</h1>
    <p>Configuration risk register</p>
  </div>
  <div class="sync"><span id="updated">Loading...</span><button id="refresh" type="button">Refresh</button></div>
</header>

<main>
  <section class="kpis" id="kpis"></section>
  <div class="mix" id="mix" aria-hidden="true"></div>

  <section class="panel">
    <div class="toolbar">
      <input type="search" id="q" placeholder="Search finding, resource or owner" aria-label="Search findings">
      <select id="f-priority" aria-label="Priority"><option value="">All priorities</option><option>P1</option><option>P2</option><option>P3</option><option>P4</option></select>
      <select id="f-environment" aria-label="Environment"><option value="">All environments</option><option>prod</option><option>staging</option><option>dev</option><option>unknown</option></select>
      <select id="f-status" aria-label="Status"><option value="">All statuses</option><option>open</option><option>acknowledged</option><option>resolved</option></select>
      <label><input type="checkbox" id="f-overdue"> Overdue only</label>
      <span class="count" id="count"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Priority</th><th>Finding</th><th>Environment</th><th>Owner</th><th>SLA</th><th>Status</th><th>Seen</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="empty" id="empty" hidden>No findings match these filters.</p>
  </section>
</main>

<script>
const PRIORITIES = ["P1", "P2", "P3", "P4"];
const expanded = new Set();
let findings = [];

// Page content is built with textContent only: finding fields come from
// external scanners and must never be treated as HTML.
function el(tag, text, className) {
  const node = document.createElement(tag);
  if (text != null) node.textContent = text;
  if (className) node.className = className;
  return node;
}
const $ = (id) => document.getElementById(id);

async function api(url, options) {
  const res = await fetch(url, options);
  if (!res.ok) throw new Error(url + " returned " + res.status);
  return res.json();
}

function fmtHours(h) {
  if (h < 1) return Math.max(1, Math.round(h * 60)) + "m";
  if (h < 48) return String(Math.round(h * 10) / 10) + "h";
  return Math.round(h / 24) + "d";
}

function slaBadge(f) {
  if (f.status === "resolved" || f.hours_left == null) return el("span", "-", "muted");
  if (f.overdue) return el("span", "Overdue " + fmtHours(-f.hours_left), "badge bad");
  return el("span", "Due in " + fmtHours(f.hours_left), f.hours_left < 4 ? "badge warn" : "badge ok");
}

function kpi(value, label, className) {
  const box = el("div", null, "kpi " + className);
  box.append(el("strong", String(value)), el("span", label));
  return box;
}

async function loadSummary() {
  const s = await api("/summary");
  const open = s.open_by_priority;
  const kpis = $("kpis");
  kpis.replaceChildren(
    ...PRIORITIES.map((p) => kpi(open[p] || 0, p + " open", p)),
    kpi(s.overdue, "Past SLA", "late" + (s.overdue > 0 ? " hot" : "")),
    kpi(s.duplicates_merged, "Duplicates merged", "")
  );
  const mix = $("mix");
  mix.replaceChildren(...PRIORITIES.map((p) => {
    const seg = el("div", null, p);
    seg.style.flexGrow = open[p] || 0;
    return seg;
  }));
}

function matches(f, q) {
  return !q || [f.title, f.resource_id, f.owner, f.team].some((v) => (v || "").toLowerCase().includes(q));
}

async function changeStatus(id, status) {
  await api("/findings/" + id + "/status", {
    method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ status }),
  });
  await refresh();
}

function detailRow(f, hidden) {
  const tr = el("tr", null, "detail" + (hidden ? " hidden" : ""));
  const td = el("td");
  td.colSpan = 7;
  const grid = el("div", null, "grid");
  for (const [title, tag, items] of [["Why this score", "ul", f.reasons], ["Suggested remediation", "ol", f.remediation]]) {
    const col = el("div");
    const list = el(tag);
    items.forEach((i) => list.append(el("li", i)));
    col.append(el("h3", title), list);
    grid.append(col);
  }
  const meta = el("div");
  meta.append(el("h3", "Context"), el("div", "Team: " + f.team + " | Account data: " + f.data_classification));
  meta.append(el("div", "First seen " + f.first_seen + (f.sla_due ? " | SLA due " + f.sla_due : "")));
  grid.append(meta);

  const actions = el("div", null, "actions");
  [["open", "Reopen"], ["acknowledged", "Acknowledge"], ["resolved", "Resolve"]].forEach(([status, label]) => {
    if (status === f.status) return;
    const btn = el("button", label, status === "resolved" ? "primary" : "");
    btn.type = "button";
    btn.addEventListener("click", () => changeStatus(f.id, status));
    actions.append(btn);
  });
  td.append(grid, actions);
  tr.append(td);
  return tr;
}

function renderRow(tbody, f) {
  const isOpen = expanded.has(f.id);
  const tr = el("tr", null, "row" + (isOpen ? " open" : ""));
  tr.tabIndex = 0;
  const finding = el("td");
  finding.append(el("div", f.title, "title"), el("div", f.resource_id, "sub"));
  const owner = el("td");
  owner.append(el("div", f.owner), el("div", f.team, "muted"));
  const env = el("td");
  env.append(el("span", f.environment, "tag" + (f.environment === "prod" ? " prod" : "")));
  const prio = el("td");
  prio.append(el("span", f.priority + " | " + f.score, "pill " + f.priority));
  const sla = el("td"); sla.append(slaBadge(f));
  const status = el("td", f.status);
  const seen = el("td", f.occurrences + (f.occurrences === 1 ? " time" : " times"), "muted");
  tr.append(prio, finding, env, owner, sla, status, seen);

  const detail = detailRow(f, !isOpen);
  const toggle = () => {
    if (expanded.has(f.id)) expanded.delete(f.id); else expanded.add(f.id);
    detail.classList.toggle("hidden");
    tr.classList.toggle("open");
  };
  tr.addEventListener("click", toggle);
  tr.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
  tbody.append(tr, detail);
}

function render() {
  const q = $("q").value.trim().toLowerCase();
  const shown = findings.filter((f) => matches(f, q));
  const tbody = $("rows");
  tbody.replaceChildren();
  shown.forEach((f) => renderRow(tbody, f));
  $("empty").hidden = shown.length > 0;
  $("count").textContent = shown.length + " of " + findings.length + " findings";
}

async function loadFindings() {
  const params = new URLSearchParams();
  for (const name of ["priority", "environment", "status"]) {
    if ($("f-" + name).value) params.set(name, $("f-" + name).value);
  }
  if ($("f-overdue").checked) params.set("overdue", "true");
  findings = await api("/findings?" + params);
  render();
}

async function refresh() {
  try {
    await Promise.all([loadSummary(), loadFindings()]);
    $("updated").textContent = "Updated " + new Date().toLocaleTimeString();
  } catch (err) {
    $("updated").textContent = "Could not load: " + err.message;
  }
}

document.querySelectorAll(".toolbar select, #f-overdue").forEach((n) => n.addEventListener("change", loadFindings));
$("q").addEventListener("input", render);
$("refresh").addEventListener("click", refresh);
refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
